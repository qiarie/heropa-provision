# =============================================================================
# Heropa overrides. Use them alongside the base file, never on their own.
#
# heropa-init.sh turns them on by writing this line into .env, so every
# `docker compose` call and `./dev.sh up` picks up both files.
#
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.heropa.yml
#
# A Heropa lab VM is reached through Cloudflare, which terminates TLS and
# forwards plain HTTP to port 80. Each Heropa Iframe interface then points at
# one app's path on that origin, /web, /keycloak, /gateway, /superset or
# /pipeline. nginx serves every path, so the proxy profile is always on, and
# dev.sh adds it to every `up`.
# =============================================================================

services:

  keycloak:
    environment:
      # Served under /keycloak/ on the lab origin. KEYCLOAK_PUBLIC_URL carries
      # the same path, so the issuer is <LAB_URL>/keycloak/realms/ohs-player.
      - KC_HTTP_RELATIVE_PATH=/keycloak
    healthcheck:
      # The management port follows the relative path, so /health/ready moves.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /keycloak/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]

  nginx:
    volumes:
      # Same target as the base file's mount, so compose replaces it rather
      # than adding a second file.
      - ./nginx/heropa/ohs-player-heropa.conf:/etc/nginx/conf.d/default.conf:ro

  superset:
    environment:
      # Served under /superset/ on the lab origin, behind nginx and Cloudflare.
      - SUPERSET_APP_ROOT=/superset
      - SUPERSET_ENABLE_PROXY_FIX=true

  pipeline-controller:
    environment:
      # Served under /pipeline/ on the lab origin. See the nginx file for the
      # endpoints the page scripts still call from the root.
      - SERVER_SERVLET_CONTEXT_PATH=/pipeline
