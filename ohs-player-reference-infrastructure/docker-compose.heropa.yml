# =============================================================================
# Heropa overrides. Use them alongside the base file, never on their own.
#
# heropa-init.sh turns them on by writing this line into .env, so every
# `docker compose` call and `./dev.sh up` picks up both files.
#
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.heropa.yml
#
# A Heropa lab VM is reached over HTTPS on port 443 at LAB_URL, which by
# default is the VM's <a-b-c-d>.sslip.io name. nginx serves each app under one
# path on that origin, /web, /keycloak, /gateway, /superset or /pipeline, so
# the proxy profile is always on, and dev.sh adds it to every `up`.
# =============================================================================

services:

  keycloak:
    environment:
      # Served under /keycloak/ on the lab origin. KEYCLOAK_PUBLIC_URL carries
      # the same path, so the issuer is <LAB_URL>/keycloak/realms/ohs-player.
      - KC_HTTP_RELATIVE_PATH=/keycloak
    healthcheck:
      # The management port follows the relative path, so /health/ready moves.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /keycloak/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]

  nginx:
    ports:
      # Browsers and Heropa's Iframe interfaces connect on 443. Port 80 stays
      # published from the base file for checks on the VM itself, and
      # certbot borrows it while nginx is stopped.
      - "443:443"
    volumes:
      # Same target as the base file's mount, so compose replaces it rather
      # than adding a second file.
      - ./nginx/heropa/ohs-player-heropa.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificate for the lab host name, put here by heropa-init.sh.
      - ./nginx/heropa/certs:/etc/nginx/certs:ro
    networks:
      fhir_net:
        aliases:
          # Containers that look up the lab host name reach this container
          # instead of going out to the internet and back.
          - ${OHS_PLAYER_APP_HOST}

  fhir-gateway:
    environment:
      # Trusts the certificate above as well as the usual public authorities,
      # so discovery at TOKEN_ISSUER succeeds through the alias.
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./nginx/heropa/certs/truststore.p12:/certs/truststore.p12:ro
    depends_on:
      # Discovery goes through nginx now, so it has to be up first.
      nginx:
        condition: service_started

  superset:
    environment:
      # Served under /superset/ on the lab origin, behind nginx.
      - SUPERSET_APP_ROOT=/superset
      - SUPERSET_ENABLE_PROXY_FIX=true

  pipeline-controller:
    environment:
      # Served under /pipeline/ on the lab origin. See the nginx file for the
      # endpoints the page scripts still call from the root.
      - SERVER_SERVLET_CONTEXT_PATH=/pipeline
